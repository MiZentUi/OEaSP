<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1200" height="900" fill="#FFFFFF"/>
<defs>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A73E8"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D93025"/></marker>
</defs>
<text x="600.0" y="28.0" font-size="24" font-weight="bold" fill="#202124" text-anchor="middle" >Последовательность HTTP-взаимодействия</text>
<rect x="70" y="50" width="200" height="42" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<text x="170.0" y="78.0" font-size="19" font-weight="bold" fill="#202124" text-anchor="middle" >CLIENT 1</text>
<line x1="170.0" y1="92.0" x2="170.0" y2="850.0" stroke="#5F6368" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="400" y="50" width="200" height="42" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<text x="500.0" y="78.0" font-size="19" font-weight="bold" fill="#202124" text-anchor="middle" >CLIENT 2</text>
<line x1="500.0" y1="92.0" x2="500.0" y2="850.0" stroke="#5F6368" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="730" y="50" width="200" height="42" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<text x="830.0" y="78.0" font-size="19" font-weight="bold" fill="#202124" text-anchor="middle" >SERVER</text>
<line x1="830.0" y1="92.0" x2="830.0" y2="850.0" stroke="#5F6368" stroke-width="1.2" stroke-dasharray="6,5"/>
<rect x="1020" y="50" width="200" height="42" rx="8" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
<text x="1120.0" y="78.0" font-size="19" font-weight="bold" fill="#202124" text-anchor="middle" >TEST RESOURCE</text>
<line x1="1120.0" y1="92.0" x2="1120.0" y2="850.0" stroke="#5F6368" stroke-width="1.2" stroke-dasharray="6,5"/>
<text x="830.0" y="125.0" font-size="17" font-weight="normal" fill="#1A73E8" text-anchor="middle" >socket, bind, listen; accept в цикле</text>
<path d="M 170 160 H 830" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="500.0" y="150.0" font-size="18" font-weight="normal" fill="#1A73E8" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">TCP connect</text>
<path d="M 830 195 H 170" fill="none" stroke="#137333" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="500.0" y="185.0" font-size="18" font-weight="normal" fill="#137333" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">TCP established</text>
<path d="M 170 240 H 830" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="500.0" y="230.0" font-size="18" font-weight="normal" fill="#1A73E8" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">GET /medium; Host; Connection: close</text>
<path d="M 830 275 H 1120" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="975.0" y="265.0" font-size="18" font-weight="normal" fill="#5F6368" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">read test resource</text>
<path d="M 1120 310 H 830" fill="none" stroke="#5F6368" stroke-width="2" marker-end="url(#arrow-gray)"/>
<text x="975.0" y="300.0" font-size="18" font-weight="normal" fill="#5F6368" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">8192 bytes</text>
<path d="M 830 350 H 170" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="500.0" y="340.0" font-size="18" font-weight="normal" fill="#1A73E8" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">200 OK, Content-Length, body</text>
<path d="M 500 410 H 830" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="665.0" y="400.0" font-size="18" font-weight="normal" fill="#1A73E8" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">TCP connect</text>
<path d="M 500 450 H 830" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="665.0" y="440.0" font-size="18" font-weight="normal" fill="#1A73E8" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">HEAD /large</text>
<path d="M 830 490 H 500" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="665.0" y="480.0" font-size="18" font-weight="normal" fill="#1A73E8" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">200 OK, Content-Length: 131072</text>
<path d="M 170 555 H 830" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="500.0" y="545.0" font-size="18" font-weight="normal" fill="#1A73E8" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">GET /chunked</text>
<path d="M 830 595 H 170" fill="none" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="500.0" y="585.0" font-size="18" font-weight="normal" fill="#1A73E8" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">Transfer-Encoding: chunked</text>
<text x="300.0" y="630.0" font-size="17" font-weight="normal" fill="#D93025" text-anchor="middle" >ERROR: unsupported encoding</text>
<path d="M 170 690 H 830" fill="none" stroke="#D93025" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,4"/>
<text x="500.0" y="680.0" font-size="18" font-weight="normal" fill="#D93025" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">close</text>
<path d="M 500 730 H 830" fill="none" stroke="#D93025" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="5,4"/>
<text x="665.0" y="720.0" font-size="18" font-weight="normal" fill="#D93025" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">close</text>
<text x="830.0" y="795.0" font-size="17" font-weight="normal" fill="#5F6368" text-anchor="middle" >fork-потомок завершён</text>
</svg>
